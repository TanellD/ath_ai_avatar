server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь отдаёт index.html, маршрутизацию делает react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты с хешем в имени — кешируем надолго, index.html — никогда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # nginx:alpine не знает расширение .mjs (HeadAudio грузится как ES-модуль
    # через динамический import() — см. TalkingHeadAvatar.tsx) — по умолчанию
    # оно ушло бы под общий default_type (application/octet-stream), и браузер
    # отказался бы грузить такой модуль: import() требует JS-совместимый
    # Content-Type. default_type здесь на уровне location, а не server, —
    # резолв типов для остальных путей не трогает.
    location ~ \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
