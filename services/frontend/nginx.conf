server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # ------------------------------------------------------------ прокси
    #
    # Браузер ходит в четыре сервиса, и до этого блока — по четырём разным
    # адресам с портами. Для телефона так нельзя: микрофон требует HTTPS, а
    # под HTTPS это четыре туннеля и четыре сертификата, плюс `ws://` со
    # страницы по https браузер режет как mixed content. Сводим всё под один
    # origin — фронтенд, — и тогда достаточно одного туннеля.
    #
    # Пути обязаны совпадать с PATHS в src/api/origins.ts и с proxy в
    # vite.config.ts.

    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /scenario/ {
        proxy_pass http://scenario-service:8050/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai/ {
        proxy_pass http://ai-service:8030/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Без слэша в proxy_pass: маршрут шлюза сам начинается с /ws/session/:id,
    # и обрезать префикс не нужно.
    location /ws/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Тренировка идёт молча между репликами — дефолтные 60 с рвали бы сокет.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /speech/ {
        proxy_pass http://speech-service:8010/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: любой путь отдаёт index.html, маршрутизацию делает react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты с хешем в имени — кешируем надолго, index.html — никогда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # nginx:alpine не знает расширение .mjs (HeadAudio грузится как ES-модуль
    # через динамический import() — см. TalkingHeadAvatar.tsx) — по умолчанию
    # оно ушло бы под общий default_type (application/octet-stream), и браузер
    # отказался бы грузить такой модуль: import() требует JS-совместимый
    # Content-Type. default_type здесь на уровне location, а не server, —
    # резолв типов для остальных путей не трогает.
    location ~ \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
