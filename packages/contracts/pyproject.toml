[project]
name = "ath-contracts"
version = "0.1.0"
description = "Общие контракты данных проекта (Claude.md §7). Единственный источник истины для всех сервисов."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ath_contracts*"]
