# Dev-режим. Compose подхватывает этот файл автоматически поверх docker-compose.yml.
# Отличия от базы: исходники прокинуты bind-mount'ом, uvicorn с --reload,
# фронтенд крутится под vite dev server вместо nginx-образа.
#
# Прод-сборка: docker compose -f docker-compose.yml up --build

services:
  gateway:
    build:
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /opt/packages
    volumes:
      - ./services/gateway/app:/app/app
      - ./services/gateway/tests:/app/tests
      - ./services/gateway/alembic.ini:/app/alembic.ini
      - ./packages:/opt/packages
      - ./data:/data
    environment:
      LOG_FORMAT: console

  speech-service:
    build:
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload --reload-dir /app/app --reload-dir /opt/packages
    volumes:
      - ./services/speech-service/app:/app/app
      - ./services/speech-service/tests:/app/tests
      - ./packages:/opt/packages
    environment:
      LOG_FORMAT: console

  ai-service:
    build:
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8030 --reload --reload-dir /app/app --reload-dir /opt/packages
    volumes:
      - ./services/ai-service/app:/app/app
      - ./services/ai-service/tests:/app/tests
      - ./packages:/opt/packages
    environment:
      LOG_FORMAT: console

  scenario-service:
    build:
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8050 --reload --reload-dir /app/app --reload-dir /opt/packages
    volumes:
      - ./services/scenario-service/app:/app/app
      - ./packages:/opt/packages
      - ./data:/data
    environment:
      LOG_FORMAT: console

  frontend:
    build:
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports: !override
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./services/frontend/src:/app/src
      - ./services/frontend/public:/app/public
      - ./services/frontend/index.html:/app/index.html
      - ./services/frontend/vite.config.ts:/app/vite.config.ts
      - frontend_node_modules:/app/node_modules
    environment:
      # Пусто = один origin: браузер ходит в /api, /ws, /scenario, /ai,
      # /speech того же хоста, а разводит их прокси (nginx.conf,
      # vite.config.ts). Так адрес перестаёт быть параметром сборки и один
      # образ работает и локально, и за HTTPS-туннелем — без чего микрофон
      # на телефоне не включится вовсе. Заполнять только если нужна прежняя
      # схема с прямым обращением в каждый сервис по своему порту.
      # Vite отвечает 403 на любой Host, кроме localhost. Для туннеля
      # (cloudflared/ngrok) открыть его домен: `.trycloudflare.com` или `true`.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_WS_URL: ${VITE_WS_URL:-}
      VITE_SCENARIO_API_URL: ${VITE_SCENARIO_API_URL:-}
      VITE_AI_API_URL: ${VITE_AI_API_URL:-}
      VITE_SPEECH_WS_URL: ${VITE_SPEECH_WS_URL:-}

volumes:
  frontend_node_modules:
