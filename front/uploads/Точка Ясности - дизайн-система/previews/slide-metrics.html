<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Слайд · цифры</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Clarity UI — UI-кит «Точка Ясности»
   Извлечён 1:1 из продакшн-стилей tochka-yasnosty.ru
   Содержит: токены, базовую типографику, кнопки, карточки, bento,
   пилюли, статистику, шаги, FAQ, формы, модалку, CTA, футер, навигацию.
   Исключены: 3D-сцена главной, ЛК и раздел обучения.
   Шрифт: Manrope 400/500/600/700/800 (Google Fonts).
   ===================================================================== */

:root {
  --bg:#EDF1F7;
  --surface:#FFFFFF;
  --surface-2:#F4F7FB;
  --ink:#0C1A33;
  --ink-2:#45536D;
  --ink-3:#5C6D89;
  --line:#E2E8F2;
  --blue:#2456E6;
  --blue-deep:#1B41C0;
  --blue-ink:#0E2A66;
  --blue-soft:#E9F0FF;
  --blue-100:#D9E5FA;
  --navy:#0B1D4E;
  --navy-2:#122E7E;
  --btn-gray:#E8EDF4;
  --btn-gray-h:#DBE2EE;
  --r-xl:40px;
  --r-lg:32px;
  --r-md:22px;
  --r-sm:14px;
  --side-w:264px;
  --pad:26px;
  --gap:24px;
  --shell-max:1774px;
  --shell-edge:max(0px, calc((100vw - var(--shell-max)) / 2));
  --hero-pill-h:38px;
  --shadow-lg:0 32px 72px -32px rgba(14, 42, 102, 0.20);
  --shadow-md:0 18px 44px -20px rgba(14, 42, 102, 0.14);
  --shadow-sm:0 8px 24px -10px rgba(14, 42, 102, 0.10);
  --ease:cubic-bezier(0.22, 0.72, 0.24, 1);
  --ease-soft:cubic-bezier(0.22, 1, 0.36, 1);
  --glass-shadow:inset 0 0 0 1px rgba(255, 255, 255, 0.03),inset 1.8px 3px 0px -2px rgba(255, 255, 255, 0.27),inset -2px -2px 0px -2px rgba(255, 255, 255, 0.24),inset -3px -8px 1px -6px rgba(255, 255, 255, 0.18),inset -0.3px -1px 4px 0px rgba(0, 0, 0, 0.24),inset -1.5px 2.5px 0px -2px rgba(0, 0, 0, 0.4),inset 0px 3px 4px -2px rgba(0, 0, 0, 0.4),inset 2px -6.5px 1px -4px rgba(0, 0, 0, 0.2),0px 1px 5px 0px rgba(0, 0, 0, 0.2),0px 6px 16px 0px rgba(0, 0, 0, 0.16);
  --glass-shadow-active:inset 0 0 0 1px rgba(255, 255, 255, 0.03),inset 1px 1px 0 0 rgba(255, 255, 255, 0.15),inset -1px -1px 0 0 rgba(255, 255, 255, 0.1),0 2px 4px rgba(0, 0, 0, 0.15);
  --glass-shadow-indicator:inset 0 0 0 1px #ffffff08,inset 2px 1px 0 -1px #ffffff45,inset -1.5px -1px 0 -1px #ffffff3d,inset -2px -6px 1px -5px #ffffff2e,inset -1px 2px 3px -1px #0006,inset 0 -4px 1px -2px #0003,0 3px 6px #00000029;
}

.glass {
  box-shadow:var(--glass-shadow);
}

.glass-active {
  box-shadow:var(--glass-shadow-active);
}

.glass-indicator {
  box-shadow:var(--glass-shadow-indicator);
}

*,::after,::before {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html {
  scroll-behavior:smooth;
  scroll-padding-top:24px;
}

body {
  font-family:Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

img,svg {
  display:block;
  max-width:100%;
}

[hidden] {
  display:none!important;
}

a {
  color:inherit;
  text-decoration:none;
}

button {
  font:inherit;
  color:inherit;
  background:0 0;
  border:0;
  cursor:pointer;
}

input {
  font:inherit;
}

::selection {
  background:var(--blue-100);
  color:var(--blue-ink);
}

:focus-visible {
  outline:3px solid rgba(36,86,230,.45);
  outline-offset:2px;
  border-radius:6px;
}

.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  border:0;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
}

.skip-link {
  position:fixed;
  top:10px;
  left:10px;
  z-index:200;
  padding:12px 20px;
  border-radius:999px;
  background:var(--blue);
  color:#fff;
  font-size:14px;
  font-weight:700;
  box-shadow:var(--shadow-md);
  transform:translateY(calc(-100% - 20px));
  transition:transform .25s var(--ease);
}

.skip-link:focus-visible {
  transform:translateY(0);
}

main[tabindex="-1"]:focus {
  outline:0;
}

.side {
  position:fixed;
  left:calc(var(--shell-edge) + var(--pad));
  top:var(--pad);
  bottom:var(--pad);
  width:var(--side-w);
  z-index:100;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:var(--r-lg);
  padding:30px 20px 22px;
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.9);
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:none;
  transition:transform .7s var(--ease),opacity .45s var(--ease) .15s,box-shadow .5s var(--ease);
}

.side::-webkit-scrollbar {
  display:none;
}

@media (min-width:1121px) and (max-height:820px) {
  .side {
    padding:20px 18px 16px;
  }

  .side .brand {
    margin-bottom:16px;
  }

  .side-label {
    margin:10px 0 5px;
  }

  .side-nav a {
    padding:8px 14px;
    font-size:14px;
  }

  .side-foot {
    padding-top:12px;
  }

  .side-cta .btn {
    padding:11px 16px;
  }
}

.side.is-scrolled {
  box-shadow:var(--shadow-lg);
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px;
  margin-bottom:30px;
}

.brand-mark {
  width:46px;
  height:46px;
  flex:none;
  object-fit:contain;
  transition:transform .5s var(--ease);
}

.brand:hover .brand-mark {
  transform:scale(1.1);
}

.brand-name {
  font-size:21px;
  font-weight:800;
  line-height:1.15;
  letter-spacing:-.03em;
}

.brand-name small {
  display:block;
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-3);
  margin-top:3px;
}

.side-label {
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-3);
  padding:0 14px;
  margin:18px 0 8px;
}

.side-nav>.side-label:first-child {
  padding-top:15px;
}

.side-nav {
  display:flex;
  flex-direction:column;
  gap:3px;
}

.side-nav a {
  display:flex;
  align-items:center;
  gap:11px;
  padding:10.5px 14px;
  border-radius:999px;
  font-size:14.5px;
  font-weight:600;
  color:var(--ink-2);
  transition:background .25s var(--ease),color .25s var(--ease),transform .25s var(--ease),opacity .5s var(--ease) calc(.26s + var(--i, 0) * .05s);
}

.side-nav a .ic {
  width:18px;
  height:18px;
  flex:none;
  opacity:.75;
}

.side-nav a:hover {
  background:var(--surface-2);
  color:var(--ink);
  transform:translateX(2px);
}

.side-nav a.is-active {
  background:var(--blue);
  color:#fff;
  box-shadow:0 10px 22px -8px rgba(36,86,230,.55);
}

.side-nav a.is-active .ic {
  opacity:1;
}

.side-foot {
  margin-top:auto;
  padding-top:22px;
}

.side-cta {
  display:flex;
  gap:10px;
}

.side-cta .btn {
  flex:1;
  justify-content:center;
  padding:13px 18px;
}

.topbar {
  display:none;
  position:fixed;
  left:16px;
  right:16px;
  top:16px;
  z-index:110;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:22px;
  padding:10px 12px 10px 18px;
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.9);
}

.topbar .brand {
  margin:0;
  padding:0;
}

.burger {
  position:relative;
  width:46px;
  height:46px;
  border-radius:16px;
  background:var(--btn-gray);
  transition:background .3s var(--ease);
}

.burger span {
  position:absolute;
  left:50%;
  top:50%;
  width:20px;
  height:2px;
  margin:-1px 0 0 -10px;
  border-radius:999px;
  background:rgba(13,22,44,.72);
  transition:transform .4s var(--ease),opacity .3s var(--ease),background .3s var(--ease);
}

.burger span:first-child {
  transform:translateY(-6.5px);
}

.burger span:nth-child(2) {
  transform:scaleX(.7);
  transform-origin:0 50%;
}

.burger span:nth-child(3) {
  transform:translateY(6.5px);
}

.burger:active span,.burger:hover span {
  background:var(--ink);
}

body.menu-open .burger {
  background:var(--blue-soft);
}

body.menu-open .burger span {
  background:var(--blue-ink);
}

body.menu-open .burger span:first-child {
  transform:rotate(45deg);
}

body.menu-open .burger span:nth-child(2) {
  opacity:0;
  transform:translateX(8px) scaleX(.4);
}

body.menu-open .burger span:nth-child(3) {
  transform:rotate(-45deg);
}

.scrim {
  position:fixed;
  inset:0;
  z-index:95;
  background:rgba(11,29,78,.45);
  backdrop-filter:blur(4px);
  opacity:0;
  pointer-events:none;
  transition:opacity .4s var(--ease);
}

body.menu-open .scrim {
  opacity:1;
  pointer-events:auto;
}

.page {
  margin-left:calc(var(--shell-edge) + var(--pad) + var(--side-w) + var(--gap));
  padding:var(--pad) var(--pad) var(--pad) 0;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  max-width:1460px;
}

.card {
  background:var(--surface);
  border-radius:var(--r-lg);
}

h1,h2,h3 {
  letter-spacing:-.03em;
  line-height:1.08;
  font-weight:800;
  text-wrap:balance;
}

h1 {
  font-size:clamp(38px, 4.3vw, 62px);
}

h2 {
  font-size:clamp(30px, 3.1vw, 46px);
  font-weight:700;
  letter-spacing:-.035em;
}

h3 {
  font-size:19px;
  letter-spacing:-.015em;
  line-height:1.3;
}

.lead {
  font-size:clamp(16px, 1.25vw, 18px);
  color:var(--ink-2);
  line-height:1.7;
}

.lead strong {
  font-weight:600;
  color:var(--ink);
}

.eyebrow :is(h1,h2,h3,h4,p,div) {
  display:inline;
  margin:0;
  padding:0;
  font:inherit!important;
  line-height:inherit!important;
  letter-spacing:inherit;
  color:inherit;
  background:0 0;
}

.eyebrow {
  display:inline-flex;
  align-items:center;
  font-size:10px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--blue);
  background:var(--blue-soft);
  box-shadow:inset 0 0 0 1px rgba(36,86,230,.16);
  border-radius:999px;
  padding:5.5px 12px;
  line-height:1.5;
}

.dot-accent {
  color:var(--blue);
}

.h1-soft {
  color:#7a8aa9;
}

.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:15px 27px;
  border-radius:999px;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.01em;
  white-space:nowrap;
  cursor:pointer;
  touch-action:manipulation;
  transition:background .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease),color .25s var(--ease);
}

.btn .ic {
  width:17px;
  height:17px;
  transition:transform .25s var(--ease);
}

.btn:hover .ic {
  transform:translateX(4px);
}

.btn:active {
  transform:translateY(1px);
  transition-duration:.1s;
}

.btn-primary {
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:var(--blue);
  color:#fff;
  box-shadow:0 1px 2px rgba(11,29,78,.26),0 12px 28px -14px rgba(11,29,78,.48);
}

.btn-primary::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  background:var(--blue-deep);
  opacity:0;
  transition:opacity .25s var(--ease);
}

.btn-primary:hover {
  transform:translateY(-1px);
  box-shadow:0 2px 3px rgba(11,29,78,.22),0 16px 34px -14px rgba(11,29,78,.52);
}

.btn-primary:hover::before {
  opacity:1;
}

.btn-primary .ic,.btn-white .ic {
  width:30px;
  height:30px;
  flex:none;
  padding:7.5px;
  border-radius:50%;
  margin:-8px -14px -8px 2px;
}

.btn-primary .ic {
  background:#fff;
  color:var(--blue-deep);
}

.btn-white .ic {
  background:var(--blue);
  color:#fff;
}

.btn-primary:hover .ic,.btn-white:hover .ic {
  transform:translateX(3px);
}

.btn-gray {
  background:0 0;
  color:var(--ink);
  box-shadow:inset 0 0 0 1.5px #c5d3e8;
}

.btn-gray:hover {
  background:var(--btn-gray);
  box-shadow:inset 0 0 0 1.5px #b7c7e2;
}

.btn-white {
  background:linear-gradient(180deg,#fff 0,#f0f4fa 100%);
  color:var(--navy);
  box-shadow:inset 0 1px 0 #fff,0 12px 34px rgba(4,16,46,.22);
}

.btn-white:hover {
  transform:translateY(-1px);
  box-shadow:inset 0 1px 0 #fff,0 16px 44px rgba(4,16,46,.3);
}

.btn-ghost {
  background:rgba(255,255,255,.06);
  color:#fff;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);
}

.btn-ghost:hover {
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);
  transform:translateY(-1px);
}

html.js .reveal {
  opacity:0;
}

html.js .reveal.in {
  opacity:1;
  animation:reveal-in .9s var(--ease-soft) var(--d,0s) backwards;
}

html.js .card.section.reveal.in,html.js .cta.reveal.in,html.js .site-footer.reveal.in,html.js .subscribe.reveal.in {
  animation-name:reveal-in-card;
  animation-duration:1s;
}

html.js .stat.reveal.in {
  animation-name:reveal-in-stat;
  animation-duration:.95s;
}

@keyframes reveal-in {
  from { opacity:0;transform:translateY(26px) }
  to { opacity:1;transform:translateY(0) }
}

@keyframes reveal-in-card {
  from { opacity:0;transform:translateY(38px) scale(.988);filter:blur(8px) }
  55% { filter:blur(0) }
  to { opacity:1;transform:translateY(0) scale(1);filter:none }
}

@keyframes reveal-in-stat {
  from { opacity:0;transform:translateY(26px) scale(.96);filter:blur(5px) }
  55% { filter:blur(0) }
  to { opacity:1;transform:translateY(0) scale(1);filter:blur(0) }
}

html.js:not(.is-loaded) .side {
  opacity:0;
  transform:translateX(-22px);
}

html.js:not(.is-loaded) .topbar {
  opacity:0;
  transform:translateY(-14px);
}

html.js:not(.is-loaded) .side .brand,html.js:not(.is-loaded) .side-foot,html.js:not(.is-loaded) .side-label,html.js:not(.is-loaded) .side-nav a {
  opacity:0;
}

html.js:not(.is-loaded) .hero-copy {
  opacity:0;
  transform:translateY(26px);
}

html.js:not(.is-loaded) .hero-copy>* {
  opacity:0;
  transform:translateY(20px);
}

html.js:not(.is-loaded) .page-head>* {
  opacity:0;
  transform:translateY(18px);
}

.topbar {
  transition:opacity .6s var(--ease) 50ms,transform .6s var(--ease) 50ms;
}

.hero-copy {
  transition:opacity .8s var(--ease) 50ms,transform .8s var(--ease) 50ms;
}

.hero-copy>* {
  transition:opacity .75s var(--ease),transform .75s var(--ease);
}

.hero-copy>h1 {
  transition-delay:0.38s;
}

.hero-copy>.lead {
  transition-delay:0.46s;
}

.hero-copy>.hero-actions {
  transition-delay:0.54s;
}

.hero-copy>.hero-facts {
  transition-delay:0.62s;
}

.side .brand {
  transition:opacity .5s var(--ease) .12s;
}

.side-label {
  transition:opacity .5s var(--ease) .2s;
}

.side-foot {
  transition:opacity .5s var(--ease) .6s;
}

.page-head>* {
  transition:opacity .75s var(--ease),transform .75s var(--ease);
}

.page-head>:first-child {
  transition-delay:0.18s;
}

.page-head>:nth-child(2) {
  transition-delay:0.27s;
}

.page-head>:nth-child(3) {
  transition-delay:0.36s;
}

.hero {
  display:grid;
  grid-template-columns:minmax(min(380px,34vw),0.82fr) minmax(0,1.18fr);
  gap:var(--gap);
  min-height:calc(100vh - var(--pad) * 2);
}

.hero-copy {
  container-type:inline-size;
  padding:clamp(32px,3.6vw,52px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  border-radius:var(--r-xl);
}

.hero-copy h1 {
  margin:30px 0 24px;
  font-size:clamp(32px, 9.8cqi, 66px);
  overflow-wrap:normal;
  word-break:keep-all;
}

.hero-copy .lead {
  max-width:52ch;
}

.hero-actions {
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:34px;
}

.hero-facts {
  display:flex;
  margin-top:30px;
  padding-top:22px;
  border-top:1px solid var(--line);
}

.hero-facts .fact {
  flex:1;
  min-width:0;
  padding-right:24px;
}

.hero-facts .fact+.fact {
  padding-left:28px;
  border-left:1px solid var(--line);
}

.hero-facts b {
  display:block;
  font-size:24px;
  font-weight:800;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}

.hero-facts span {
  display:block;
  margin-top:6px;
  font-size:14px;
  font-weight:600;
  line-height:1.5;
  color:var(--ink-3);
  text-wrap:balance;
}

.chip {
  position:absolute;
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(22px) saturate(165%);
  -webkit-backdrop-filter:blur(22px) saturate(165%);
  border:1px solid rgba(255,255,255,.75);
  border-radius:18px;
  padding:12px 17px;
  box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.85);
  font-size:13px;
  font-weight:700;
  color:var(--blue-ink);
  will-change:transform;
  animation:floaty 7s ease-in-out infinite;
}

.chip b {
  display:block;
  font-size:16px;
  font-weight:800;
  letter-spacing:-.02em;
}

.chip small {
  display:block;
  font-size:11px;
  font-weight:600;
  color:var(--ink-2);
}

.chip .chip-ic {
  width:34px;
  height:34px;
  flex:none;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  display:grid;
  place-items:center;
}

.chip .chip-ic .ic {
  width:16px;
  height:16px;
}

.chip:nth-of-type(2) {
  animation-delay:-2.4s;
}

.chip:nth-of-type(3) {
  animation-delay:-4.8s;
}

@keyframes floaty {
  0%,100% { transform:translate3d(0,0,0) }
  50% { transform:translate3d(0,-12px,0) }
}

.strip {
  display:flex;
  align-items:center;
  gap:22px;
  padding:4px 12px;
}

.strip-note {
  display:flex;
  align-items:center;
  font-size:14.5px;

/* =====================================================================
   EXTENDED TOKENS — формализованы из фактических стилей компонентов.
   Нужны для брендбука, шаблона презентации и новых продуктов.
   ===================================================================== */
:root {
/* ---------------------------------------------------------------
     EXTENDED · ТИПОГРАФИКА
     --------------------------------------------------------------- */
  --font-sans: Manrope, "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --fs-h3: 19px;
  --fs-stat: clamp(33px, 2.9vw, 45px);
  --fs-lead: clamp(16px, 1.25vw, 18px);
  --fs-body: 16px;
  --fs-ui: 15px;         /* кнопки, поля ввода */
  --fs-nav: 14px;        /* пункты навигации, поля форм в модалке */
  --fs-caption: 13.5px;  /* подписи к статистике */
  --fs-pill: 12px;       /* пилюли-теги */
  --fs-micro: 11px;      /* мелкие подписи в чипах */
  --fs-eyebrow: 10px;    /* надзаголовок капсом */

  --lh-tight: 1.08;      /* h1/h2 */
  --lh-heading: 1.3;     /* h3 */
  --lh-body: 1.6;        /* базовый текст */
  --lh-lead: 1.7;        /* лид-абзац */

  --ls-display: -0.03em;
  --ls-h2: -0.035em;
  --ls-h3: -0.015em;
  --ls-ui: -0.01em;
  --ls-eyebrow: 0.14em;

  /* ---------------------------------------------------------------
     EXTENDED · РАДИУСЫ КОМПОНЕНТОВ
     --------------------------------------------------------------- */
  --r-pill: 999px;   /* кнопки, пилюли, eyebrow, точки навигации */
  --r-chip: 18px;    /* «стеклянный» чип */
  --r-icon: 16px;    /* плитка иконки продукта 48×48 */
  --r-field: 13px;   /* поля ввода */
  --r-topbar: 22px;  /* мобильная шапка */

  /* ---------------------------------------------------------------
     EXTENDED · РАЗМЕРЫ ЭЛЕМЕНТОВ
     --------------------------------------------------------------- */
  --size-icon: 17px;        /* иконка внутри кнопки */
  --size-icon-sm: 13px;     /* иконка внутри пилюли */
  --size-icon-tile: 48px;   /* плитка иконки продукта */
  --size-arrow-btn: 44px;   /* круглая кнопка-стрелка */
  --size-icon-badge: 30px;  /* белый кружок с иконкой в btn-primary */

  /* ---------------------------------------------------------------
     EXTENDED · ОТСТУПЫ (шаг 4 px; фактические значения сайта)
     --------------------------------------------------------------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 18px;
  --space-6: 22px;
  --space-7: 24px;
  --space-8: 26px;
  --space-9: 30px;
  --space-10: 38px;
  --space-11: 44px;

  --pad-cta: clamp(52px, 6vw, 92px) clamp(30px, 5vw, 80px);

  --gap-grid: 18px;   /* сетки продуктов и сегментов */
  --gap-stats: 16px;  /* сетка статистики */

  /* ---------------------------------------------------------------
     EXTENDED · ТЕНИ КОМПОНЕНТОВ
     --------------------------------------------------------------- */
  --shadow-btn-primary: 0 1px 2px rgba(11, 29, 78, 0.26), 0 12px 28px -14px rgba(11, 29, 78, 0.48);
  --shadow-btn-primary-hover: 0 2px 3px rgba(11, 29, 78, 0.22), 0 16px 34px -14px rgba(11, 29, 78, 0.52);
  --shadow-btn-white: inset 0 1px 0 #fff, 0 12px 34px rgba(4, 16, 46, 0.22);
  --shadow-modal: 0 44px 110px -34px rgba(4, 16, 46, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --shadow-glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --ring-secondary: inset 0 0 0 1.5px #c5d3e8;        /* контур btn-gray */
  --ring-secondary-hover: inset 0 0 0 1.5px #b7c7e2;
  --ring-arrow: inset 0 0 0 1.5px #c9d6ea;            /* контур arrow-btn */
  --ring-eyebrow: inset 0 0 0 1px rgba(36, 86, 230, 0.16);
  --focus-ring: 3px solid rgba(36, 86, 230, 0.45);

  /* ---------------------------------------------------------------
     EXTENDED · ГРАДИЕНТЫ И СТЕКЛО
     --------------------------------------------------------------- */
  --grad-navy: linear-gradient(150deg, var(--navy) 0%, var(--navy-2) 90%);
  --grad-cta: linear-gradient(150deg, var(--navy) 0%, var(--navy-2) 85%);
  --grad-blue-soft: linear-gradient(150deg, #E6EFFC 0%, #C9DCF8 100%);
  --grad-subscribe: linear-gradient(150deg, #E6EFFC, #CBDDF8 60%, #BDD4F7);
  --grad-footer: linear-gradient(180deg, #E7EDF6 0%, #E0E8F3 100%);
  --grad-btn-white: linear-gradient(180deg, #FFFFFF 0%, #F0F4FA 100%);

  --glass-bg: rgba(255, 255, 255, 0.82);        /* сайдбар */
  --glass-bg-chip: rgba(255, 255, 255, 0.58);   /* парящий чип */
  --glass-border: 1px solid rgba(255, 255, 255, 0.7);
  --glass-blur: blur(24px) saturate(160%);
  --glass-blur-chip: blur(22px) saturate(165%);

  /* ---------------------------------------------------------------
     EXTENDED · ДЛИТЕЛЬНОСТИ
     --------------------------------------------------------------- */
  --dur-instant: 0.1s;  /* :active */
  --dur-fast: 0.25s;    /* кнопки, поля */
  --dur-base: 0.35s;    /* иконки, строки списков */
  --dur-slow: 0.45s;    /* карточки: подъём и тень */
  --dur-modal: 0.65s;   /* появление модального окна */
  --dur-reveal: 0.9s;   /* появление секции при скролле */
  --stagger-step: 0.04s;
  --stagger-start: 0.1s;

  /* ---------------------------------------------------------------
     EXTENDED · БРЕНД-КОНСТАНТЫ
     --------------------------------------------------------------- */
  --brand-logo-blue: #2757FC;  /* синий в SVG-логотипе (ярче UI-синего) */
  --brand-mark-size: 34px;     /* знак в сайдбаре и футере */
}

/* =====================================================================
   SAFEGUARDS — мелкие правила для сборки новых макетов.
   Капсульные элементы (eyebrow, пилюли) не должны растягиваться,
   когда попадают прямым потомком во flex-колонку.
   ===================================================================== */
.eyebrow,
.bento-pill {
  align-self: flex-start;
}

/* =====================================================================
   HERO VISUAL — правая панель первого экрана (градиентная плашка под
   скриншот, схему или анимацию). order:-1 ставит её слева на десктопе.
   ===================================================================== */

html.js:not(.is-loaded) .hero-visual { opacity:0; transform:translateY(24px) scale(.98); }

.hero-visual { transition:opacity .9s var(--ease) .15s,transform .9s var(--ease) .15s; }

.hero-visual { position:relative; overflow:hidden; order:-1; border-radius:var(--r-xl); background:linear-gradient(158deg,#e2ebfa 0,#cdddf8 48%,#bbd0f5 100%); min-height:420px; }

@media (min-width:1121px) and (max-height:880px) {

}

@media (min-width:1121px) and (max-height:740px) {
  .hero-visual { min-height:400px; }
}

@media (max-width:1120px) {
  .hero-visual { order:0; }
}
